# Overlay for the GKE deployment, loaded instead of app-config.production.yaml.
app:
  baseUrl: ${BASE_URL}

backend:
  baseUrl: ${BASE_URL}
  listen:
    port: 7007

  # config options: https://node-postgres.com/api/client
  database:
    client: pg
    connection:
      database: ${POSTGRES_DB}
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
    # The "backstage" role can't CREATE DATABASE, so plugins share one database via schemas.
    pluginDivisionMode: schema

cors:
  origin: ${BASE_URL}

# Also read at startup by security-metrics-backend and regelrett-schemas-backend, not just for sign-in.
auth:
  environment: development
  providers:
    microsoft:
      development:
        clientId: ${ENTRA_WEB_APP_ID}
        clientSecret: ${ENTRA_WEB_CLIENT_SECRET}
        tenantId: ${ENTRA_TENANT_ID}
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        additionalScopes: [public_repo]

regelrett:
  enable: true
  baseUrl: http://service-regelrett.ns-regelrett.svc.cluster.local
  url: https://regelrett.slo.fleks.dev
  clientId: ${REGELRETT_CLIENT_ID}


sikkerhetsmetrikker:
  enable: true
  baseUrl: http://sikkerhetsmetrikker.sikkerhetsmetrikker-main:8080
  clientId: ${SIKKERHETSMETRIKKER_CLIENT_ID}

catalog:
  locations:
    - type: url
      target: https://github.com/bekk/funksjonsregister.sla/tree/main/catalog-info.yaml
    - type: url
      target: https://github.com/bekk/app-metrics-exporter/tree/main/catalog-info.yaml
  providers:
    microsoftGraphOrg:
      default:
        tenantId: ${ENTRA_TENANT_ID}
        queryMode: 'advanced'
        user:
          filter: accountEnabled eq true and userType eq 'member' and startsWith(companyName, 'Staten')
          select:
            [
              'accountEnabled',
              'displayName',
              'givenName',
              'id',
              'mail',
              'mailNickname',
              'userPrincipalName',
              'surname',
              'companyName',
              'userType',
            ]
        group:
          filter: >
            startswith(displayName, 'AAD - TF - TEAM') or startswith(displayName, 'AAD - TF - BUSINESS UNIT') or startswith(displayName, 'AAD - TF - PRODUCT AREA')
        schedule:
          frequency: PT1H
          timeout: PT50M
        clientId: ${ENTRA_ID_SP_APP_ID}
        clientSecret: ${ENTRA_ID_SP_CLIENT_SECRET}

ros:
  sops:
    ageKey: dummy
    backendPublicKey: dummy
    securityTeamPublicKey: dummy
    securityPlatformPublicKey: dummy
  slack:
    webhookUrl: dummy
  initRiSc:
    repoOwner: kartverket
    repoName: initial-riscs-collection
