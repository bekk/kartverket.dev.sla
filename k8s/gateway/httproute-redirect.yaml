apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-redirect-https
  namespace: ns-gateway
  labels:
    app.kubernetes.io/part-of: gateway
spec:
  parentRefs:
    - name: gateway-external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
