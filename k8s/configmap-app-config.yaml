apiVersion: v1
kind: ConfigMap
metadata:
  name: config-backstage-app-config
  namespace: ns-backstage
data:
  # Lastes sist av deployment-en, så verdiene her overstyrer app-config.production.yaml.
  app-config.gke.yaml: |
    backend:
      database:
        connection:
          # Postgres i clusteret har ikke TLS ennå. Trafikken går bare internt i clusteret.
          ssl: false
    integrations:
      # Prod bruker en GitHub App via $include av en fil som ikke finnes i imaget.
      # Lister slås ikke sammen i Backstage-config, så denne erstatter prod-lista.
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    techdocs:
      builder: local
      publisher:
        type: local

  # app-config.production.yaml gjør $include av github-secrets/github-app-backstage-skip-credentials.yaml.
  # $include løses per fil før filene slås sammen, så fila må finnes selv om lista over erstatter den.
  github-app-placeholder.yaml: |
    {}
