apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-default-deny-ingress
  namespace: ns-backstage
  labels:
    app.kubernetes.io/part-of: backstage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Traffic and health checks from Google's load balancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-allow-gclb-to-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/part-of: backstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 7007
