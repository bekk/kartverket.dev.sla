apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  parentRefs:
    - name: gateway-external
      namespace: ns-gateway
      sectionName: https
  hostnames:
    - backstage.slo.fleks.dev
  rules:
    - backendRefs:
        - name: service-backstage
          port: 7007
---
# Health check on the readiness endpoint instead of "/".
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: healthcheckpolicy-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /.backstage/health/v1/readiness
  targetRef:
    group: ''
    kind: Service
    name: service-backstage
