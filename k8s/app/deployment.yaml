apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      securityContext:
        runAsNonRoot: true
        # The distroless image defaults to root, so runAsNonRoot needs an explicit UID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          # Replaced with the built image at deploy.
          image: IMAGE_PLACEHOLDER
          # Skips app-config.production.yaml and app-config.runtime.yaml, whose secrets aren't set up here.
          args:
            - '--require'
            - './instrumentation.js'
            - 'packages/backend'
            - '--config'
            - 'app-config.yaml'
            - '--config'
            - 'app-config.kubernetes.yaml'
          ports:
            - name: http
              containerPort: 7007 
          env:
            - name: BASE_URL
              value: https://backstage.slo.fleks.dev
          envFrom:
            - secretRef:
                name: secret-backstage-db
            - secretRef:
                name: secret-backstage-auth
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
