apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      securityContext:
        runAsNonRoot: true
        # gcr.io/distroless/nodejs24-debian13 has no image-level nonroot user
        # (defaults to root), so runAsNonRoot alone makes kubelet refuse to
        # start the container. Pin a UID explicitly instead of touching the
        # Dockerfile — same approach as statefulset-backstage-postgres.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          # TODO: replace with the built-and-pushed image, e.g.
          # europe-north1-docker.pkg.dev/<project-id>/<repo>/backstage:<tag>
          image: IMAGE_PLACEHOLDER
          # Overrides the Dockerfile's default CMD args: skip
          # app-config.production.yaml/app-config.runtime.yaml (they require
          # Entra/Google/GitHub-App secrets not wired up yet for this smoke test).
          args:
            - '--require'
            - './instrumentation.js'
            - 'packages/backend'
            - '--config'
            - 'app-config.yaml'
            - '--config'
            - 'app-config.kubernetes.yaml'
          ports:
            - name: http
              containerPort: 7007 
          env:
            # TODO: point this at a real hostname (behind an Ingress) once one
            # exists; until then this only works via `kubectl port-forward`.
            - name: BASE_URL
              value: http://localhost:7007
          envFrom:
            - secretRef:
                name: secret-backstage-db
            - secretRef:
                name: secret-backstage-auth
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
