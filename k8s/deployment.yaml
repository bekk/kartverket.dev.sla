apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-backstage
  namespace: ns-backstage
  labels:
    app.kubernetes.io/name: spire-backstage
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-backstage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-backstage
          image: europe-north1-docker.pkg.dev/gcp-fleks-grafanaslo/spire-grafana-slo/backstage:20260925-1100-1a7fd7d
          # Erstatter CMD i Dockerfile: 
          # app-config.runtime.yaml er byttet ut med app-config.gke.yaml
          # Grunn: runtime fila krever filer som ikke finnes på GKE.
          args:
            - --require
            - ./instrumentation.js
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
            - --config
            - /app/config/app-config.gke.yaml
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - configMapRef:
                name: config-backstage
            - secretRef:
                name: secret-backstage-db
            - secretRef:
                name: secret-backstage-oauth
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-config
              mountPath: /app/config
              readOnly: true
            - name: github-app-placeholder
              mountPath: /app/github-secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-config
          configMap:
            name: config-backstage-app-config
            items:
              - key: app-config.gke.yaml
                path: app-config.gke.yaml
        - name: github-app-placeholder
          configMap:
            name: config-backstage-app-config
            items:
              - key: github-app-placeholder.yaml
                path: github-app-backstage-skip-credentials.yaml