apiVersion: v1
kind: Service
metadata:
  name: service-backstage-postgres
  namespace: ns-backstage-db
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-backstage-postgres
  namespace: ns-backstage-db
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: service-backstage-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-backstage-postgres
                  key: POSTGRES_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-backstage-postgres
                  key: APP_DB_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "/var/run/postgresql"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "/var/run/postgresql"]
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: initdb
          configMap:
            name: config-postgres-initdb
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi