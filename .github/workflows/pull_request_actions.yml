name: Pull Request Actions

on:
  pull_request:
    types: [opened, synchronize]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/test.yml

  dependency-review:
    permissions:
      contents: read # Required for reading repository
      pull-requests: write # Required for dependency review comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Perform dependency review
        uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          comment-summary-in-pr: always
          fail-on-severity: moderate
          allow-dependencies-licenses: |
            pkg:github/kartverket/backstage-techdocs-action

  build:
    name: build
    needs: [test, dependency-review]
    permissions:
      contents: read # Required for actions/checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x # From mise.toml
          cache: 'npm'

      - name: Aktiver corepack
        run: corepack enable

      - name: Installer avhengigheter
        run: yarn install --immutable

      - name: Bygg backend-bundle
        run: yarn build:backend

      - uses: docker/setup-buildx-action@v4

      # Samme Dockerfile som deployen bruker, men uten push.
      - name: Bygg container-imaget
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
